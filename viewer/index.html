<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Interior 3D Tour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5.15.1/index.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.module.js",
    "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.module.js",
    "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5.15.1/index.module.js"
  }
}
</script>
<style>
  :root { --bg: #fafaf9; --panel: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --panel: #292524; --ink: #fafaf9; --muted: #a8a29e; --line: #44403c; --accent: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #viewer { min-width: 0; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row.btn { cursor: pointer; }
  .row.btn:hover, .row.active { color: var(--accent); }
  .row small { color: var(--muted); }
  .tag { background: rgba(0,0,0,.72); color: #fff; border: 1px solid #fbbf24; border-radius: 4px;
         padding: 2px 6px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  #error { padding: 24px; color: #b91c1c; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 60vh 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewer"></div>
  <aside>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="subtitle"></p>
    <div class="bar"><span id="spent-bar" style="width:0"></span></div>
    <div class="row"><span>Spent</span><span id="spent"></span></div>
    <div class="row"><span>Remaining</span><span id="remaining"></span></div>
    <h2>Rooms</h2>
    <div id="rooms"></div>
    <h2 id="items-title">Items in this room</h2>
    <div id="items"></div>
  </aside>
</div>
<div id="error" hidden></div>

<script type="module">
import { mountTour, esc } from './tour.js';

const manifestUrl = new URL(new URLSearchParams(location.search).get('manifest') || '../out/manifest.json', location.href);
const $ = (id) => document.getElementById(id);

try {
  const res = await fetch(manifestUrl);
  if (!res.ok) throw new Error(`could not load ${manifestUrl} (${res.status})`);
  start(await res.json());
} catch (err) {
  $('app').hidden = true;
  $('error').hidden = false;
  $('error').textContent = `${err.message}. Generate one with: python -m engine.plan ... then python -m generator.generate ...`;
}

function start(manifest) {
  const meta = manifest.metadata;
  const nodes = manifest.topology.nodes;
  const money = (n) => `${meta.currency} ${Math.round(n).toLocaleString()}`;
  $('title').textContent = `${meta.bhk} · ${meta.total_area_sqm} m² · ${meta.aesthetic_theme}`;
  $('subtitle').textContent = `${meta.tier} tier · budget ${money(meta.total_budget)}`;
  $('spent').textContent = money(meta.spent);
  $('remaining').textContent = money(meta.remaining);
  $('spent-bar').style.width = `${Math.min(100, (meta.spent / meta.total_budget) * 100)}%`;

  const byId = Object.fromEntries(nodes.map((n) => [n.room_id, n]));
  const tour = mountTour({ container: $('viewer'), manifest, manifestUrl, onRoomChange: showRoom });

  function showRoom(roomId) {
    const node = byId[roomId];
    document.querySelectorAll('#rooms .row').forEach((el) => el.classList.toggle('active', el.dataset.id === roomId));
    $('items-title').textContent = `Items in ${node.room_name}`;
    $('items').innerHTML = node.hotspots.filter((h) => h.type === 'product_tag').map((h) =>
      `<div class="row btn" data-marker="${esc(h.id)}"><span>${esc(h.payload.title)}<br><small>${esc(h.payload.material)}</small></span>` +
      `<span>${Math.round(h.payload.cost).toLocaleString()}</span></div>`).join('');
  }

  $('rooms').innerHTML = nodes.map((n) =>
    `<div class="row btn" data-id="${esc(n.room_id)}"><span>${esc(n.room_name)}<br><small>${n.area_sqm} m²</small></span>` +
    `<span>${Math.round(n.allocated_budget).toLocaleString()}</span></div>`).join('');
  $('rooms').addEventListener('click', (e) => { const row = e.target.closest('[data-id]'); if (row) tour.setRoom(row.dataset.id); });
  $('items').addEventListener('click', (e) => { const row = e.target.closest('[data-marker]'); if (row) tour.gotoMarker(row.dataset.marker); });
}
</script>
</body>
</html>
